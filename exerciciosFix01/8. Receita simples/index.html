    <title>8. Receita simples</title>

<body>
    <h1>Receita de miojo</h1>
    <hr>
    <br>
    <ul>
        <li>1 pacote de miojo</li>
        <li>500 ml de água</li>
        <li>1 colher de sopa de óleo</li>
        <li>1 pitada de sal</li>
    </ul>
    <hr>
    <br>
    <h2>Modo de preparo:</h2>
    <ol>
        <li>Coloque a água em uma panela e leve ao fervor.</li>
        <li>Adicione o miojo e cozinhe por 3 minutos.</li>
        <li>Retire do fogo e adicione o óleo e o sal.</li>
        <li> Sirva quente.</li>
    </ol>
    <hr><hr>
    <br>

</body>
